<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brooklyn Cowgirl | Official Gallery</title>
  
  <!-- Google Fonts: Sacramento (Cute Cursive) & Plus Jakarta Sans (Clean Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* Global Variables - Moody Dark & Light Blue Theme */
    :root {
      --bg-color: #0b0e14;
      --card-bg: #141923;
      --text-main: #b3e5fc; /* Cute Light Blue */
      --text-glow: #81d4fa;
      --text-muted: #64b5f6;
      --accent-blue: #4fc3f7;
      --border-color: rgba(147, 197, 253, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header / Hero Section */
    header {
      text-align: center;
      padding: 3.5rem 1.5rem 2rem;
      background: radial-gradient(circle at top, rgba(79, 195, 247, 0.12), transparent 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Profile Avatar Styling */
    .profile-avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-blue);
      box-shadow: 0 0 20px rgba(79, 195, 247, 0.4);
      margin-bottom: 1.25rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile-avatar:hover {
      transform: scale(1.03);
      box-shadow: 0 0 30px rgba(79, 195, 247, 0.6);
    }

    .subtitle {
      font-size: 0.9rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-blue);
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    h1 {
      font-family: 'Sacramento', cursive;
      font-size: clamp(3.5rem, 8vw, 5.5rem);
      color: var(--text-main);
      text-shadow: 0 0 15px rgba(129, 212, 250, 0.4);
      margin-bottom: 0.2rem;
      line-height: 1.1;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 300;
      margin-bottom: 2rem;
    }

    /* Action Buttons */
    .links-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .btn-instagram {
      background: linear-gradient(45deg, #29b6f6, #0288d1, #ab47bc);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(41, 182, 246, 0.3);
    }

    .btn-instagram:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(41, 182, 246, 0.5);
    }

    .btn-website {
      border: 1px solid var(--border-color);
      color: var(--text-main);
      background: rgba(179, 229, 252, 0.05);
    }

    .btn-website:hover {
      border-color: var(--accent-blue);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(79, 195, 247, 0.3);
      transform: translateY(-2px);
    }

    /* Gallery Grid */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      flex-grow: 1;
      width: 100%;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      aspect-ratio: 4 / 5;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      border-color: var(--accent-blue);
      box-shadow: 0 10px 25px rgba(79, 195, 247, 0.2);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(5, 8, 15, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      backdrop-filter: blur(8px);
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-img {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(79, 195, 247, 0.3);
      border: 1px solid var(--border-color);
      object-fit: contain;
    }

    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      color: var(--text-main);
      font-size: 2.5rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .lightbox-close:hover {
      color: #ffffff;
      text-shadow: 0 0 10px var(--accent-blue);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
    }

    footer a {
      color: var(--text-main);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <img src="profile.jpeg" alt="Brooklyn Cowgirl Profile" class="profile-avatar">
    <p class="subtitle">Official Portfolio</p>
    <h1>Brooklyn Cowgirl</h1>
    <p class="tagline">AI Model & Digital Creator</p>
    
    <div class="links-container">
      <a href="https://instagram.com/brook.cowgirl" target="_blank" class="btn btn-instagram">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        @brook.cowgirl
      </a>
      <a href="https://brooklyncowgirl.link" class="btn btn-website">
        brooklyncowgirl.link
      </a>
    </div>
  </header>

  <main>
    <div class="gallery-grid">
      <div class="gallery-item">
        <img src="pic1.jpeg" alt="Brooklyn Cowgirl photo 1">
      </div>
      <div class="gallery-item">
        <img src="pic2.jpeg" alt="Brooklyn Cowgirl photo 2">
      </div>
      <div class="gallery-item">
        <img src="pic3.jpeg" alt="Brooklyn Cowgirl photo 3">
      </div>
      <div class="gallery-item">
        <img src="pic4.jpeg" alt="Brooklyn Cowgirl photo 4">
      </div>
      <div class="gallery-item">
        <img src="pic5.jpeg" alt="Brooklyn Cowgirl photo 5">
      </div>
      <div class="gallery-item">
        <img src="pic6.jpeg" alt="Brooklyn Cowgirl photo 6">
      </div>
    </div>
  </main>

  <!-- Lightbox Container -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close" id="lightboxClose">&times;</span>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Expanded View">
  </div>

  <footer>
    <p>&copy; 2026 Brooklyn Cowgirl. All rights reserved. | <a href="https://instagram.com/brook.cowgirl" target="_blank">Instagram</a></p>
  </footer>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');
    const galleryItems = document.querySelectorAll('.gallery-item img');

    galleryItems.forEach(image => {
      image.addEventListener('click', () => {
        lightboxImg.src = image.src;
        lightboxImg.alt = image.alt;
        lightbox.classList.add('active');
      });
    });

    lightboxClose.addEventListener('click', () => {
      lightbox.classList.remove('active');
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target !== lightboxImg) {
        lightbox.classList.remove('active');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('active')) {
        lightbox.classList.remove('active');
      }
    });
  </script>

</body>
</html>
