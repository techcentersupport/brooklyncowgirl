<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brooklyn Cowgirl | Official Gallery</title>
  
  <!-- Google Fonts for custom Western-chic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* Global Variables */
    :root {
      --bg-color: #0f0d0e;
      --card-bg: #191618;
      --text-main: #f3efe6;
      --text-muted: #a39b98;
      --accent-gold: #d4af37;
      --accent-terracotta: #c86d51;
      --border-color: rgba(212, 175, 55, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header / Hero Section */
    header {
      text-align: center;
      padding: 4rem 1.5rem 2rem;
      background: radial-gradient(circle at top, rgba(200, 109, 81, 0.15), transparent 70%);
    }

    .subtitle {
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent-terracotta);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      letter-spacing: 0.05em;
      color: var(--text-main);
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 300;
      margin-bottom: 2rem;
    }

    /* Action Buttons */
    .links-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .btn-instagram {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
      box-shadow: 0 4px 15px rgba(220, 39, 67, 0.3);
    }

    .btn-instagram:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(220, 39, 67, 0.5);
    }

    .btn-website {
      border: 1px solid var(--border-color);
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .btn-website:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
      transform: translateY(-2px);
    }

    /* Gallery Grid */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      flex-grow: 1;
      width: 100%;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      aspect-ratio: 4 / 5;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: transform 0.4s ease, border-color 0.4s ease;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      border-color: var(--border-color);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    footer a {
      color: var(--accent-gold);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <p class="subtitle">Official Portfolio</p>
    <h1>Brooklyn Cowgirl</h1>
    <p class="tagline">AI Model & Digital Creator</p>

</body>
</html>
